# used across the sim by any random processes to ensure reproducible runs
random_seed = 2403

# Configuration of the high level simulation setup.
[radar]
carrier_frequency_hz = 5.8e9
transmit_power_w = 10.0
tx_antenna_gain_linear = 10.0
rx_antenna_gain_linear = 10.0

# Configuration of the transmitted OFDM symbols
[ofdm]
# Supported options: BPSK, QPSK, 16QAM, 32QAM
modulation = "QPSK"
subcarrier_spacing_hz = 60e3
num_subcarriers = 512
num_symbols = 1024
cyclic_prefix_samples = 256

# Configuration of the channel that the radar signals are propagating through
[radar_channel]
reference_snr_db = 10.0   # omit to disable noise

# Configuration of the channel that the data signals are propagating through
[downlink_channel]
rician_k_factor_db = 10.0
max_doppler_hz = 5.0
direct_path_doppler_hz = 0.0
snr_db = 40.0             # omit to disable noise

# The multipath components of the data channel. Each of these individual items
# represents one path that the data signals can take. 

# !!! Deterministic component !!! 
[[downlink_channel.paths]]
delay_s = 0.0
gain_db = 0.0

[[downlink_channel.paths]]
delay_s = 100e-9
gain_db = -3.0

[[downlink_channel.paths]]
delay_s = 250e-9
gain_db = -6.0

[[downlink_channel.paths]]
delay_s = 500e-9
gain_db = -9.0

# Some configuration of how the reflected signals are processed by the transmitter
[processing]
range_fft_size = 1024
doppler_fft_size = 2048

# Physical layout of the wireless scene, in metres. Coordinates are scaled
# from the diagram so the farthest scatterer is 300 m from Tx. The direct
# Tx-to-Rx path and three two-leg paths via scatterers mirror the diagram.
[scene]
tx_position_m = [42.94, 137.42]
rx_position_m = [386.50, 188.96]
direct_path = ["Tx", "Rx"]

# Scatter paths: Tx -> scatterer -> Rx. Velocities are in the x/y directions.
[[scene.scatter_paths]]
waypoints = ["Tx", "Scatterer A", "Rx"]

[[scene.scatter_paths]]
waypoints = ["Tx", "Scatterer B", "Rx"]

[[scene.scatter_paths]]
waypoints = ["Tx", "Scatterer C", "Rx"]

# The radar model below uses each scatterer's distance from Tx and radial speed
# (positive means approaching). Position and velocity components describe the
# 2D scene; range and radial velocity are the corresponding sensing inputs.
[[targets]]
name = "Scatterer A"
position_m = [150.31, 249.08]
velocity_xy_m_s = [2.4, -1.2]
range_m = 154.90
velocity_m_s = -20.80
rcs_m2 = 1.0

[[targets]]
name = "Scatterer B"
position_m = [266.26, 60.12]
velocity_xy_m_s = [-1.5, 2.2]
range_m = 236.31
velocity_m_s = 10.14
rcs_m2 = 0.8

[[targets]]
name = "Scatterer C"
position_m = [317.79, 257.67]
velocity_xy_m_s = [2.8, 1.6]
range_m = 300.00
velocity_m_s = -5.21
rcs_m2 = 0.8

# If outputting figures, some config about how these plots should be generated and where
[output]
show_plots = true
save_plots = true
figure_directory = "figures"
max_display_range_m = 350.0
display_velocity_range_m_s = [-40.0, 40.0]
