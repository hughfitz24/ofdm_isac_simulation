[project]
name = "ofdm-radar-sim"
version = "0.1.0"
description = "Modular OFDM radar simulation with configurable target scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
ofdm-radar-sim = "ofdm_radar_sim.app:main"

[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.uv]
package = true
